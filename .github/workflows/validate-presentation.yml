name: Presentation CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install
      - run: pip install -r requirements-export.txt
      - run: npm run generate
      - name: Reject invalid generated content
        run: "! grep -R -nE 'undefined|layout: hash-content' slides/generated/session-01.md"
      - name: Build canonical deck with strict warning checks
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          ! grep -q 'Unknown layout' build.log
      - name: Build showcase with strict warning checks
        run: |
          set -o pipefail
          npm run build:showcase 2>&1 | tee showcase.log
          ! grep -q 'Unknown layout' showcase.log
      - run: npm run export:all
      - run: |
          test -s dist/hashcode-session-01-ia-productivite-ai-agents.pptx
          test -s dist/hashcode-session-01-ia-productivite-ai-agents.pdf
      - run: npm audit --audit-level=critical
